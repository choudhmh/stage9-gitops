replicaCount: 1

fastapi:
  image:
    repository: stage1-fastapi
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

redis:
  image: redis:7
  port: 6379
  existingSecret: fastapi-redis-secret
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  host: gitops.localhost
  path: /api(/|$)(.*)
