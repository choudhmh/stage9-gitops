apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapi-redis.fullname" . }}-redis
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fastapi-redis.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "fastapi-redis.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          ports:
            - containerPort: {{ .Values.redis.port }}
          command:
            - redis-server
            - --requirepass
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "fastapi-redis.fullname" . }}-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fastapi-redis.fullname" . }}-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: {{ include "fastapi-redis.fullname" . }}-pvc